name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Check Python syntax
        run: python -m py_compile main.py fps_capture.py
      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Performance Air" --collect-all pynvml main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Performance-Air-Windows
          path: dist/Performance Air.exe
          if-no-files-found: error
