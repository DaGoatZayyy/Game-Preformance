name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Download official PresentMon CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          $release = Invoke-RestMethod "https://api.github.com/repos/GameTechDev/PresentMon/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match '^PresentMon-.*-x64\.exe$' } | Select-Object -First 1
          if (-not $asset) { throw "No x64 PresentMon executable found" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "tools/PresentMon.exe"
      - name: Check Python syntax
        run: python -m py_compile main.py fps_capture.py
      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Performance Air" --collect-all pynvml --add-binary "tools/PresentMon.exe;tools" main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Performance-Air-Windows
          path: dist/Performance Air.exe
          if-no-files-found: error
